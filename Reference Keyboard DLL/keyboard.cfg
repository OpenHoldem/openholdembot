[Timing]
InterKeyDelayMin=90            ; Minimum delay between keystrokes in ms
InterKeyDelayMax=450           ; Maximum delay between keystrokes in ms
KeyPressDurationMin=80         ; Minimum duration a key is held (ms)
KeyPressDurationMax=150        ; Maximum duration a key is held (ms)
FingerMovementDelayFactor=30   ; Extra delay in ms per grid unit of finger movement

[Error]
ErrorSimulationProbability=6   ; 6% chance per key press to simulate a typo
ErrorCandidateThreshold=1.0    ; Maximum grid distance (in grid units) for error candidates (1.0 means only immediately adjacent keys)
DeletionKey=0                  ; 0 = use Backspace for correction, 1 = use Delete
